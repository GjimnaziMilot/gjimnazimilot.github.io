<body>

<div class="portal-card">
    <div class="portal-header">
        <h1>Gjimnazi Milot</h1>
        <p>Rezultatet e maturës shtetërore sesioni II të <strong>gjuhës së huaj</strong> për maturantët e Gjimnazit Milot dhe të gjithë IA-ve në Republikën e Shqipërisë</p>
    </div>
    
    <div class="portal-body">
        <div id="status" class="status-msg">Duke u lidhur me serverin e të dhënave...</div>
        
        <div class="input-group" id="searchGroup">
            <label for="studentId">Shkruaj ID e Maturantit</label>
            <input type="text" id="studentId" class="input-field" placeholder="Psh. 253625000271" maxlength="12">
        </div>
        
        <button id="searchBtn" class="btn-kerko" onclick="kerkoId()">KËRKO REZULTATIN</button>
        
        <div id="alertBox" class="alert-box"></div>

        <div id="resultContainer" class="result-container">
            <div class="result-box">
                <div class="result-title">Nota e Shkallëzuar</div>
                <div id="resNota" class="nota-highlight">-</div>
            </div>
        </div>
        
        <a href="maturasesioni2.html" class="btn-kthehu">← Kthehu në faqen kryesore</a>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let tekstiPloteIPdf = "";

    async function ngarkoPDFNgaKodi() {
        const status = document.getElementById('status');
        
        if (!pdfBase64Data || pdfBase64Data.includes("KËTU_VENDOSET_TEKSTI_BASE64")) {
            status.innerHTML = "<span style='color:red;'>Gabim: PDF nuk është integruar ende në kod!</span>";
            return;
        }
        
        status.innerText = 'Po ngarkohen rezultatet e Maturës... Ju lutem prisni...';

        try {
            const binaryString = atob(pdfBase64Data.trim());
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            const pdf = await pdfjsLib.getDocument({ data: bytes.buffer }).promise;
            tekstiPloteIPdf = "";

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                let tekstiFaqes = textContent.items.map(item => item.str).join(" ");
                tekstiPloteIPdf += " " + tekstiFaqes;
            }

            // Pastrojmë vetëm hapësirat artificiale brenda numrave të gjatë 12-shifrorë
            tekstiPloteIPdf = tekstiPloteIPdf.replace(/(\d)\s+(?=\d{11})/g, '$1');

            status.style.display = 'none';
            document.getElementById('searchGroup').style.display = 'block';
            document.getElementById('searchBtn').style.display = 'block';
            document.getElementById('studentId').focus();

        } catch (error) {
            console.error(error);
            status.innerText = 'Gabim kritik gjatë leximit të bazës së të dhënave!';
        }
    }

    window.addEventListener('load', ngarkoPDFNgaKodi);

    function kerkoId() {
        const idInput = document.getElementById('studentId').value.trim();
        const resultContainer = document.getElementById('resultContainer');
        const alertBox = document.getElementById('alertBox');
        
        resultContainer.style.display = 'none';
        alertBox.style.display = 'none';

        if(idInput.length !== 12 || isNaN(idInput)) {
            shfaqAlert("Ju lutem vendosni një ID të vlefshme me 12 shifra!", "error");
            return;
        }

        let pozicioni = tekstiPloteIPdf.indexOf(idInput);

        if(pozicioni !== -1) {
            // Marrim pjesën e tekstit që fillon ekzaktesisht nga ID-ja juaj
            let fragmenti = tekstiPloteIPdf.substring(pozicioni, pozicioni + 150);
            
            // E ndajmë tekstin në pjesë sipas hapësirave dhe heqim elementet boshe
            let elementet = fragmenti.split(/\s+/).filter(el => el.trim() !== "");
            
            // Bazuar në strukturën tuaj të saktë:
            // elementet[0] = ID-ja (262526600011)
            // elementet[1] = Lënda (FRËNGJISHT ose ANGLISHT)
            // elementet[2] = Niveli ( (B2) )
            // elementet[3] = Pikët (60)
            // elementet[4] = Nota e Shkallëzuar (10) <-- Kjo është ajo që na duhet!
            
            if (elementet.length >= 5) {
                let notaFinale = elementet[4].replace(',', '.');
                
                // Sigurohemi që elementi i përzgjedhur është vërtet një numër note (p.sh. midis 4 dhe 10)
                if(!isNaN(notaFinale) && parseFloat(notaFinale) <= 10) {
                    document.getElementById('resNota').innerText = notaFinale;
                    resultContainer.style.display = 'block';
                    return;
                }
            }
            
            // Logjikë rezervë në rast se struktura e rreshtit ndryshon minimalisht për lëndë të tjera
            let ndarjeNumrash = fragmenti.match(/\b\d+([\.,]\d+)?\b/g);
            if(ndarjeNumrash && ndarjeNumrash.length >= 3) {
                document.getElementById('resNota').innerText = ndarjeNumrash[2].replace(',', '.');
                resultContainer.style.display = 'block';
            } else {
                shfaqAlert("U gjet ID-ja, por struktura e notës nuk u dekodua dot.", "error");
            }
            
        } else {
            shfaqAlert("Kjo ID nuk u gjet në sistem! Kontrolloni nëse e keni shkruar saktë.", "error");
        }
    }

    function shfaqAlert(mesazhi, tipi) {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerText = mesazhi;
        alertBox.className = 'alert-box ' + tipi;
        alertBox.style.display = 'block';
    }
</script>
