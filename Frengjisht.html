<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portali Studentor - Matura Shtetërore 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .portal-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #e1e8ed;
        }

        .portal-header {
            background-color: #0d3b66;
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }

        .portal-header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .portal-header p {
            font-size: 14px;
            color: #f4d35e;
            font-weight: 500;
        }

        .portal-body {
            padding: 30px 25px;
        }

        .input-group {
            margin-bottom: 20px;
            display: none; 
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }

        .btn-kerko {
            width: 100%;
            padding: 14px;
            background-color: #0d3b66;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            margin-bottom: 15px;
            transition: background-color 0.2s ease;
        }
        
        .btn-kerko:hover {
            background-color: #092c4e;
        }

        .status-msg {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .result-container {
            margin-top: 25px;
            margin-bottom: 20px;
            display: none;
        }

        .result-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .result-title {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .nota-highlight {
            color: #e63946;
            font-size: 36px;
            font-weight: 800;
        }

        .alert-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error { background-color: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }

        /* 🌟 STILIMI I RI PËR BUTONIN "KTHEHU PAS" */
      .btn-kthehu {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            color: #000000;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
            transition: all 0.2s ease;
        }
        .btn-kthehu:hover {
            color: #000000;
            background-color: #ff5e00;
            border-color: #94a3b8;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="portal-card">
    <div class="portal-header">
        <h1>Gjimnazi Milot</h1>
        <p>Rezultatet e maturës shtetërore në <bold>gjuhës së huaj</bold> për maturantët e Gjimnazit Milot dhe të gjithë  IA-ve në Republikën e Shqipërisë </p>
    </div>
    
    <div class="portal-body">
        <div id="status" class="status-msg">Duke u lidhur me serverin e të dhënave...</div>
        
        <div class="input-group" id="searchGroup">
            <label for="studentId">Shkruaj ID e Maturantit</label>
            <input type="text" id="studentId" class="input-field" placeholder="Psh. 253625000271" maxlength="12">
        </div>
        
        <button id="searchBtn" class="btn-kerko" onclick="kerkoId()">KËRKO REZULTATIN</button>
        
        <div id="alertBox" class="alert-box"></div>

        <div id="resultContainer" class="result-container">
            <div class="result-box">
                <div class="result-title">Nota e Shkallëzuar</div>
                <div id="resNota" class="nota-highlight">-</div>
            </div>
        </div>
        
        <a href="rezultatet-kryesore.html" class="btn-kthehu">← Kthehu në faqen kryesore</a>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let bazaETedhenave = {};

    async function ngarkoPDFNgaKodi() {
        const status = document.getElementById('status');
        
        if (!pdfBase64Data || pdfBase64Data.includes("KËTU_VENDOSET_TEKSTI_BASE64")) {
            status.innerHTML = "<span style='color:red;'>Gabim: PDF nuk është integruar ende në kod!</span>";
            return;
        }
        
        status.innerText = 'Po ngarkohen rezultatet e Maturës... Ju lutem prisni...';

        try {
            const binaryString = atob(pdfBase64Data.trim());
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            const pdf = await pdfjsLib.getDocument({ data: bytes.buffer }).promise;
            bazaETedhenave = {};

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                let linesMap = {};
                textContent.items.forEach(item => {
                    if (!item.str.trim()) return;
                    let y = Math.round(item.transform[5]); 
                    if (!linesMap[y]) linesMap[y] = [];
                    linesMap[y].push(item);
                });

                let sortedY = Object.keys(linesMap).sort((a, b) => b - a);

                sortedY.forEach(y => {
                    let lineItems = linesMap[y].sort((a, b) => a.transform[4] - b.transform[4]);
                    let rreshtiPlote = lineItems.map(item => item.str).join(" ");

                    const regexId = /\b\d{12}\b/;
                    const match = rreshtiPlote.match(regexId);

                    if (match) {
                        let idMaturanti = match[0];
                        let pjesaTjeter = rreshtiPlote.replace(idMaturanti, "");
                        
                        let numratDhjetor = pjesaTjeter.match(/\b\d+[\.,]\d+\b/g);
                        
                        if (numratDhjetor && numratDhjetor.length > 0) {
                            let notaFinale = numratDhjetor[numratDhjetor.length - 1]; 
                            bazaETedhenave[idMaturanti] = notaFinale.replace(',', '.');
                        }
                    }
                });
            }

            status.style.display = 'none';
            document.getElementById('searchGroup').style.display = 'block';
            document.getElementById('searchBtn').style.display = 'block';
            document.getElementById('studentId').focus();

        } catch (error) {
            console.error(error);
            status.innerText = 'Gabim kritik gjatë leximit të bazës së të dhënave!';
        }
    }

    window.addEventListener('load', ngarkoPDFNgaKodi);

    function kerkoId() {
        const idInput = document.getElementById('studentId').value.trim();
        const resultContainer = document.getElementById('resultContainer');
        const alertBox = document.getElementById('alertBox');
        
        resultContainer.style.display = 'none';
        alertBox.style.display = 'none';

        if(idInput.length !== 12 || isNaN(idInput)) {
            shfaqAlert("Ju lutem vendosni një ID të vlefshme me 12 shifra!", "error");
            return;
        }

        if(bazaETedhenave.hasOwnProperty(idInput)) {
            document.getElementById('resNota').innerText = bazaETedhenave[idInput];
            resultContainer.style.display = 'block';
        } else {
            shfaqAlert("Kjo ID nuk u gjet në sistem! Kontrolloni nëse e keni shkruar saktë.", "error");
        }
    }

    function shfaqAlert(mesazhi, tipi) {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerText = mesazhi;
        alertBox.className = 'alert-box ' + tipi;
        alertBox.style.display = 'block';
    }
</script>

<script>
    // Vendos kodin e plotë Base64 të PDF-së tënde mes thonjëzave:
const pdfBase64Data = "KËTU_VENDOSET_TEKSTI_BASE64";
</script>

</body>
</html>
